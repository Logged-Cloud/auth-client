name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.deps }} deps
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: ['lowest', 'stable']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-${{ matrix.deps }} --prefer-dist --no-interaction --no-progress

      - name: Run Pest
        run: vendor/bin/pest
